var MS=[
{id:"m1",a:3,t:"Marco 1: Linux na ponta dos dedos",art:"<p>No Linux, quase tudo é arquivo: configurações, dispositivos e processos. Quem domina o terminal domina o sistema, e você vai passar a maior parte do tempo em pentest nele.</p><p>Três ideias para aprofundar. Permissões: o chmod 640 dá leitura e escrita ao dono, só leitura ao grupo e nada aos outros. Erros de permissão são falhas comuns em servidores, e a escalação de privilégios costuma começar por eles. Pipes: grep, awk, cut e sed filtram a saída de um comando e passam para o seguinte, o que permite analisar logs e resultados de scans. Serviços: cada porta aberta é um programa rodando, e saber listar e parar serviços é a base de atacar e de defender.</p><p>Para aprofundar: leia no livro The Linux Command Line os capítulos sobre permissões, pipelines e shell scripts, e refaça o Bandit sem consultar nada.</p>",qz:[["Qual comando lista as portas e serviços em escuta?",["pwd","ss -tulpn","chmod 777","cat /etc"],1],["O que significa chmod 640 arquivo?",["Todos podem tudo","Só o grupo escreve","Dono lê e escreve, grupo só lê, outros nada","Só o dono executa"],2],["Qual comando mostra só as linhas com a palavra erro de um arquivo?",["cd erro","ls erro","grep erro arquivo","chown erro"],2],["O que faz o pipe (|)?",["Apaga o arquivo","Muda permissões","Cria um usuário","Envia a saída de um comando como entrada do próximo"],3]]},
{id:"m2",a:5,t:"Marco 2: Como a rede conversa",art:"<p>Quando você abre um site, o DNS traduz o nome em um IP, o TCP abre a conexão com o 3-way handshake (SYN, SYN-ACK, ACK) e o HTTP pede a página. Você viu cada passo no Wireshark.</p><p>Isso importa porque um port scan é só enviar SYN e observar a resposta: SYN-ACK significa porta aberta e RST significa porta fechada. O que você capturou agora é o que o Nmap faz na Etapa 3. Entender o protocolo também mostra por que firewalls e IDS bloqueiam certos padrões.</p><p>Para aprofundar: capture o acesso a um site e anote cada pacote, e leia no livro do Nmap (nmap.org/book) o capítulo sobre técnicas de varredura.</p>",qz:[["O 3-way handshake do TCP é:",["ACK, ACK, FIN","DNS, HTTP, TCP","SYN, SYN-ACK, ACK","PING, PONG, ACK"],2],["Qual protocolo traduz nome em IP?",["ARP","DNS","ICMP","FTP"],1],["O ping usa qual protocolo?",["UDP 53","HTTP","ICMP","SSH"],2],["Uma resposta RST a um SYN indica:",["Porta aberta","Porta fechada","DNS falhou","Firewall desligado"],1]]},

/* Preencha com os dados gerados em giscus.app: repo no formato usuario/repositorio, repoId e categoryId */
var GC={repo:"",repoId:"",category:"Comunidade",categoryId:""};
var CT="geral",THR=[["geral","Geral e dúvidas"],["semana-1","Semana 1"],["semana-2","Semana 2"],["semana-3","Semana 3"],["semana-4","Semana 4"],["semana-5","Semana 5"],["semana-6","Semana 6"]];
function pCom(){
  return '<h2>Comunidade</h2><div class="card"><h3>Regras da casa</h3><div class="meta">Aqui todos se ajudam a estudar. Para manter o espaço seguro:<br>1. Fale só de laboratórios seus ou de plataformas de treino (TryHackMe, Hack The Box, OverTheWire).<br>2. Pedidos para invadir sistemas, contas ou redes de terceiros serão apagados.<br>3. Não publique senhas, documentos, IPs reais, telefones ou outros dados pessoais.<br>4. Seja gentil: todo mundo começou do zero.</div></div>'+
  '<div class="card"><div class="meta">Este site não pede cadastro. Seu progresso fica só no seu navegador. Para comentar, o sistema de comentários usa uma conta gratuita do GitHub. Veja como tratamos dados na <a href=privacidade.html>Política de Privacidade</a>.</div></div>'+
  '<div class="card"><div class="meta">Escolha o assunto:</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+THR.map(function(t){return '<button class="'+(t[0]===CT?'go':'ghost')+'" data-th="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div></div><div id="gc"></div>';
}
function loadComments(){
  var c=document.getElementById("gc");if(!c)return;
  if(!GC.repoId||!GC.categoryId){c.innerHTML='<div class="note">Os comentários estão sendo configurados. Volte em breve.</div>';return}
  var s=document.createElement("script");s.src="https://giscus.app/client.js";
  var a={"data-repo":GC.repo,"data-repo-id":GC.repoId,"data-category":GC.category,"data-category-id":GC.categoryId,"data-mapping":"specific","data-term":CT,"data-strict":"1","data-reactions-enabled":"1","data-emit-metadata":"0","data-input-position":"top","data-theme":"dark","data-lang":"pt"};
  for(var k in a)s.setAttribute(k,a[k]);
  s.crossOrigin="anonymous";s.async=true;c.appendChild(s);
}
function lockCalc(){WEEKS.forEach(function(w,i){w.locked=i>0&&!weekIds(WEEKS[i-1]).every(done)})}
function pMarcos(){
  return '<h2>Marcos</h2>'+MS.map(function(m,i){
    if(!weekIds(WEEKS[m.a-1]).every(done))return '<div class="card lock"><h3>'+m.t+'<span class="tag">bloqueado</span></h3><div class="meta">Libera ao concluir a Semana '+m.a+'.</div></div>';
    var s=S["s_"+m.id];
    return '<div class="card"><h3>'+m.t+(s!==undefined?'<span class="tag">'+s+'/'+m.qz.length+(s>=3?' aprovado':' refazer')+'</span>':'')+'</h3>'+m.art+'<h3 style="margin-top:14px">Prova</h3>'+m.qz.map(function(q,j){return '<div class="meta" style="margin-top:10px">'+(j+1)+'. '+q[0]+'</div>'+q[1].map(function(o,k){return '<div class="row"><input type="radio" name="q'+i+'_'+j+'" id="q'+i+'_'+j+'_'+k+'" value="'+k+'"><label for="q'+i+'_'+j+'_'+k+'">'+o+'</label></div>'}).join('')}).join('')+'<button class="go" data-q="'+i+'" style="margin-top:12px">Corrigir prova</button></div>';
  }).join('');
}
function pPerfil(){
  var ids=allIds(),ap=MS.filter(function(m){return S["s_"+m.id]>=3}).length;
  return '<h2>Perfil</h2><div class="card"><h3>Seu nome</h3><input id="nm" maxlength="40" placeholder="Digite seu nome" value="'+(S._n||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")+'" style="width:100%;padding:10px;background:#000;color:var(--txt);border:1px solid var(--line);border-radius:4px;font:inherit"><button class="go" id="savep" style="margin-top:10px">Salvar nome</button></div><div class="grid"><div class="card stat"><b>'+pct(cnt(ids),ids.length)+'%</b><span>da Etapa 1 concluída</span></div><div class="card stat"><b>'+ap+'/'+MS.length+'</b><span>provas aprovadas</span></div></div>';
}
function render(){lockCalc();var g=document.querySelector(".hero p");g.textContent=S._n?"Bem-vindo, "+S._n+". Siga o coelho branco, uma aula por vez.":"Cibersegurança do zero ao profissional. Siga o coelho branco, uma aula por vez.";
  var t=document.getElementById("tabs");
  t.innerHTML=TABS.map(function(n,i){return '<button data-t="'+i+'"'+(i===TAB?' aria-current="true"':'')+'>'+n+'</button>'}).join('');
  document.getElementById("view").innerHTML=[pPainel,pSemana,pTrilha,pMarcos,pCom,pPerfil,pInst][TAB]();if(TAB===4)loadComments();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){TAB=+b.dataset.t;render();window.scrollTo(0,0)}
  if(b.dataset.th){CT=b.dataset.th;render()}
  if(b.id==="ckY"||b.id==="ckN"){try{localStorage.setItem("cb-consent",b.id==="ckY"?"yes":"no")}catch(x){}document.getElementById("ck").innerHTML="";if(b.id==="ckY")loadAds()}
  if(b.dataset.q!==undefined){var m=MS[+b.dataset.q],s=0;m.qz.forEach(function(q,j){var r=document.querySelector('input[name="q'+b.dataset.q+'_'+j+'"]:checked');if(r&&+r.value===q[2])s++});S["s_"+m.id]=s;save();render()}
  if(b.id==="savep"){S._n=document.getElementById("nm").value.trim().slice(0,40);save();render()}
  if(b.id==='reset'){if(b.dataset.c){S={_n:S._n};save();render()}else{b.dataset.c=1;b.textContent='Toque de novo para confirmar'}}
});
document.addEventListener("change",function(e){
  var id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  if(e.target.checked)S[id]=1;else delete S[id];
  save();render();
});
render();

setup();

/* Chuva de código, só no cabeçalho */
(function(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=document.getElementById("rain"),x=c.getContext("2d"),ch="アイウエオカキクケコサシスセソ01ABCDEF",f=14,cols,y=[];
  function size(){c.width=c.offsetWidth;c.height=c.offsetHeight;cols=Math.ceil(c.width/f);y=[];for(var i=0;i<cols;i++)y.push(Math.random()*-20)}
  size();window.addEventListener("resize",size);
  setInterval(function(){
    if(document.hidden)return;
    x.fillStyle="rgba(0,0,0,.12)";x.fillRect(0,0,c.width,c.height);
    x.fillStyle="#00ff66";x.font=f+"px monospace";
    for(var i=0;i<cols;i++){
      x.fillText(ch[Math.floor(Math.random()*ch.length)],i*f,y[i]*f);
      if(y[i]*f>c.height&&Math.random()>.975)y[i]=0;
      y[i]++;
    }
  },60);
})();
</script>
</body>
</html>
